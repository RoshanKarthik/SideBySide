<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Technical interviews in one link: video call, shared code editor with hidden tests, whiteboard, private scorecard and full replay."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SideBySide</title>
    <script>
      // Light unless the visitor chose dark; applied before first paint to avoid a flash.
      let dark = false;
      try {
        dark = localStorage.getItem('sbs-theme') === 'dark';
      } catch {}
      if (dark) document.documentElement.classList.add('dark');
      // Mid sign-in (or sign-out): paint navy from the first frame, so the page load under the
      // curtain never flashes white (see components/sign-in-curtain.tsx).
      try {
        if (sessionStorage.getItem('sbs-curtain')) {
          document.documentElement.classList.add('curtain-pending');
        }
      } catch {}
    </script>
    <style>
      html.curtain-pending,
      html.curtain-pending body {
        background: hsl(201 100% 11%) !important;
      }
      html.curtain-pending #root {
        visibility: hidden;
        /* Never stay hidden, even if the app fails to start. */
        animation: curtain-unhide 0s 4s forwards;
      }
      @keyframes curtain-unhide {
        to {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
