<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Technical interviews in one link: video call, shared code editor with hidden tests, whiteboard, private scorecard and full replay."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SideBySide</title>
    <script>
      // Light unless the visitor chose dark; applied before first paint to avoid a flash.
      let dark = false;
      try {
        dark = localStorage.getItem('sbs-theme') === 'dark';
      } catch {}
      if (dark) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
