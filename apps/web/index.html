<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <meta
      name="description"
      content="Live technical interviews: shared notes, a real code editor and replays, from one link."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SideBySide</title>
    <script>
      // Dark unless the visitor chose light; applied before first paint to avoid a flash.
      let dark = true;
      try {
        dark = localStorage.getItem('sbs-theme') !== 'light';
      } catch {}
      if (dark) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
